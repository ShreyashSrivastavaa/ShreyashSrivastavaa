name: GitHub Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Generate GitHub Card
        run: |
          cat > generate-card.js <<'EOF'
          const { chromium } = require("playwright");

          (async () => {
            const browser = await chromium.launch({
              headless: true
            });

            const page = await browser.newPage({
              viewport: {
                width: 1600,
                height: 1000
              },
              deviceScaleFactor: 2
            });

            await page.goto(
              "https://gitfc.vercel.app/card?username=ShreyashSrivastavaa",
              {
                waitUntil: "networkidle",
                timeout: 120000
              }
            );

            await page.waitForTimeout(5000);

            await page.screenshot({
              path: "assets/github-card/github-card.png",
              fullPage: false
            });

            await browser.close();
          })();
          EOF

          node generate-card.js

      - name: Commit GitHub Card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github-card/github-card.png

          git diff --cached --quiet || git commit -m "Update GitHub FC card"

          git push
